<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memoria Andina 3D</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #131f24;
    color: #3c3c3c;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  #app-container {
    width: 100%;
    max-width: 400px;
    background-color: #ffffff;
    border-radius: 24px;
    padding: 20px;
    box-sizing: border-box;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    text-align: center;
  }

  .header {
    font-size: 22px;
    font-weight: bold;
    color: #58cc02;
    margin-bottom: 20px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 20px;
  }

  /* Contenedor principal de la tarjeta con perspectiva 3D */
  .tarjeta {
    height: 100px;
    perspective: 1000px;
    cursor: pointer;
    user-select: none;
  }

  /* Animación de hundimiento al hacer clic (solo en la cara frontal) */
  .tarjeta:not(.volteada):not(.resuelta):active .tarjeta-front {
    transform: translateY(4px);
    border-bottom-width: 2px;
  }

  /* Envoltura interna que realiza el giro */
  .tarjeta-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Giro con ligero rebote */
    transform-style: preserve-3d;
  }

  /* Activar el giro cuando tiene la clase */
  .tarjeta.volteada .tarjeta-inner,
  .tarjeta.resuelta .tarjeta-inner {
    transform: rotateY(180deg);
  }

  /* Estilos compartidos para ambas caras */
  .tarjeta-front, .tarjeta-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-size: 16px;
    font-weight: bold;
    box-sizing: border-box;
  }

  /* Cara frontal (El signo de interrogación) */
  .tarjeta-front {
    background-color: #e5e5e5;
    border: 2px solid #cecece;
    border-bottom: 6px solid #cecece;
    transition: transform 0.1s, border-bottom-width 0.1s;
  }

  .signo {
    font-size: 40px;
    color: #afafaf;
  }

  /* Cara trasera (El contenido revelado) */
  .tarjeta-back {
    background-color: #ffffff;
    border: 2px solid #e5e5e5;
    border-bottom: 6px solid #e5e5e5;
    transform: rotateY(180deg);
  }

  /* Estilo cuando la pareja es correcta */
  .tarjeta.resuelta .tarjeta-back {
    background-color: #ddf4ff;
    border-color: #84d8ff;
    border-bottom-color: #1cb0f6;
    color: #1cb0f6;
  }

  .emoji { font-size: 30px; margin-bottom: 5px; }

  .btn-reset {
    width: 100%;
    height: 50px;
    border-radius: 16px;
    border: none;
    font-size: 18px;
    font-weight: bold;
    color: white;
    cursor: pointer;
    background-color: #1cb0f6;
    box-shadow: 0 4px 0 #1899d6;
    transition: transform 0.1s;
  }
  .btn-reset:active {
    transform: translateY(4px);
    box-shadow: 0 0px 0 transparent;
  }
</style>
</head>
<body>

<div id="app-container">
  <div class="header">Encuentra los pares 🧠</div>
  <div class="grid" id="tablero"></div>
  <button class="btn-reset" onclick="iniciarJuego()">REINICIAR</button>
</div>

<script>
  const pares = [
    { id: 1, emoji: '☀️', texto: 'Inti' },
    { id: 1, emoji: '☀️', texto: 'Inti' },
    { id: 2, emoji: '🌙', texto: 'Killa' },
    { id: 2, emoji: '🌙', texto: 'Killa' },
    { id: 3, emoji: '⛰️', texto: 'Urqu' },
    { id: 3, emoji: '⛰️', texto: 'Urqu' },
    { id: 4, emoji: '💧', texto: 'Yaku' },
    { id: 4, emoji: '💧', texto: 'Yaku' },
    { id: 5, emoji: '🦅', texto: 'Kuntur' },
    { id: 5, emoji: '🦅', texto: 'Kuntur' },
    { id: 6, emoji: '🔥', texto: 'Nina' },
    { id: 6, emoji: '🔥', texto: 'Nina' }
  ];

  let tablero = document.getElementById('tablero');
  let cartasVolteadas = [];
  let bloqueo = false;
  let paresEncontrados = 0;

  function barajar(array) {
    return array.sort(() => Math.random() - 0.5);
  }

  function iniciarJuego() {
    tablero.innerHTML = '';
    cartasVolteadas = [];
    bloqueo = false;
    paresEncontrados = 0;
    
    let cartasMezcladas = barajar([...pares]);

    cartasMezcladas.forEach((carta) => {
      let elemento = document.createElement('div');
      elemento.classList.add('tarjeta');
      elemento.dataset.id = carta.id;
      
      // Nueva estructura HTML interna para el efecto 3D
      elemento.innerHTML = `
        <div class="tarjeta-inner">
          <div class="tarjeta-front">
            <span class="signo">?</span>
          </div>
          <div class="tarjeta-back">
            <span class="emoji">${carta.emoji}</span>
            <span>${carta.texto}</span>
          </div>
        </div>
      `;

      elemento.addEventListener('click', () => voltearCarta(elemento));
      tablero.appendChild(elemento);
    });
  }

  function voltearCarta(carta) {
    if (bloqueo || carta.classList.contains('volteada') || carta.classList.contains('resuelta')) return;

    carta.classList.add('volteada');
    cartasVolteadas.push(carta);

    if (cartasVolteadas.length === 2) {
      bloqueo = true;
      verificarPar();
    }
  }

  function verificarPar() {
    let [carta1, carta2] = cartasVolteadas;

    if (carta1.dataset.id === carta2.dataset.id) {
      carta1.classList.replace('volteada', 'resuelta');
      carta2.classList.replace('volteada', 'resuelta');
      paresEncontrados++;
      resetearTurno();

      if (paresEncontrados === pares.length / 2) {
        setTimeout(() => alert('¡Excelente! Completaste el nivel.'), 500);
      }
    } else {
      setTimeout(() => {
        carta1.classList.remove('volteada');
        carta2.classList.remove('volteada');
        resetearTurno();
      }, 1000); // Tiempo que se muestran antes de volver a girar
    }
  }

  function resetearTurno() {
    cartasVolteadas = [];
    bloqueo = false;
  }

  iniciarJuego();
</script>

</body>
</html>
